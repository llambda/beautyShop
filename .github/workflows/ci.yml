name: Build and test BeautyStudio

on:
  push:
    branches:
      - main
      - feature/beauty-studio-complete-management
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore test project
        run: dotnet restore Tests/BeautyStudio.Tests.csproj

      - name: Run automated tests
        run: dotnet test Tests/BeautyStudio.Tests.csproj --configuration Release --no-restore

      - name: Build WPF application
        run: dotnet build BeautyStudioCB.csproj --configuration Release --no-restore
